<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberUtility Hub - Futuristic Tools</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            min-height: 100vh;
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }
        h1 { 
            text-align: center; 
            color: #38bdf8; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .tool-box { 
            margin-bottom: 20px; 
            padding: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            background: rgba(15, 23, 42, 0.6); 
        }
        h3 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 18px;
        }
        label { font-size: 14px; color: #94a3b8; }
        select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            margin-bottom: 12px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #0f172a; 
            color: #fff;
            font-size: 15px; 
            box-sizing: border-box; 
        }
        select:focus, textarea:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        .date-row { display: flex; gap: 8px; }
        .date-row select { flex: 1; }
        button { 
            background: linear-gradient(135deg, #0ea5e9, #2563eb); 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        button:active { transform: scale(0.98); }
        .result { 
            margin-top: 12px; 
            font-weight: 600; 
            color: #4ade80; 
            font-size: 14px; 
            word-break: break-all;
            background: rgba(74, 222, 128, 0.1);
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #4ade80;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cyber Utility Hub</h1>
    
    <!-- Age Calculator Tool -->
    <div class="tool-box">
        <h3>Age Calculator</h3>
        <label>Select Your Date of Birth:</label>
        <div class="date-row">
            <select id="birthDay">
                <option value="">Day</option>
            </select>
            <select id="birthMonth">
                <option value="">Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <select id="birthYear">
                <option value="">Year</option>
            </select>
        </div>
        <button onclick="calculateAge()">Calculate Age</button>
        <div class="result" id="ageResult" style="display:none;"></div>
    </div>

    <!-- Word Counter Tool -->
    <div class="tool-box">
        <h3>Word & Character Counter</h3>
        <textarea id="textInput" rows="3" placeholder="Type or paste your text here..."></textarea>
        <button onclick="countWords()">Analyze Text</button>
        <div class="result" id="wordResult" style="display:none;"></div>
    </div>

    <!-- Password Generator Tool -->
    <div class="tool-box">
        <h3>Cyber Password Generator</h3>
        <button onclick="generatePassword()">Generate Secure Key</button>
        <div class="result" id="passwordResult" style="display:none;"></div>
    </div>
</div>

<script>
    window.onload = function() {
        const daySelect = document.getElementById('birthDay');
        for(let i=1; i<=31; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = i;
            daySelect.appendChild(opt);
        }

        const yearSelect = document.getElementById('birthYear');
        const currentYear = new Date().getFullYear();
        for(let i=currentYear; i>=1940; i--) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = i;
            yearSelect.appendChild(opt);
        }
    };

    function calculateAge() {
        const d = document.getElementById('birthDay').value;
        const m = document.getElementById('birthMonth').value;
        const y = document.getElementById('birthYear').value;
        const resBox = document.getElementById('ageResult');

        if(!d || !m || !y) {
            resBox.style.display = "block";
            resBox.style.color = "#f87171";
            resBox.style.borderLeftColor = "#f87171";
            resBox.style.background = "rgba(248, 113, 113, 0.1)";
            resBox.innerText = "Please select valid Day, Month, and Year!";
            return;
        }

        const birth = new Date(y, m - 1, d);
        const today = new Date();
        let years = today.getFullYear() - birth.getFullYear();
        let months = today.getMonth() - birth.getMonth();
        let days = today.getDate() - birth.getDate();

        if (days < 0) {
            months--;
            days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }
        resBox.style.display = "block";
        resBox.style.color = "#4ade80";
        resBox.style.borderLeftColor = "#4ade80";
        resBox.style.background = "rgba(74, 222, 128, 0.1)";
        resBox.innerText = `Your age is ${years} years, ${months} months, and ${days} days.`;
    }

    function countWords() {
        const text = document.getElementById('textInput').value.trim();
        const words = text === "" ? 0 : text.split(/\s+/).length;
        const chars = text.length;
        const resBox = document.getElementById('wordResult');
        resBox.style.display = "block";
        resBox.innerText = `Total Words: ${words} | Total Characters: ${chars}`;
    }

    function generatePassword() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
        let password = "";
        for(let i = 0; i < 14; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const resBox = document.getElementById('passwordResult');
        resBox.style.display = "block";
        resBox.innerText = `Secure Key: ${password}`;
    }
</script>

</body>
</html
